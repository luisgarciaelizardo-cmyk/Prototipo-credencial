<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Credencial</title>
  <style>
    body {
      margin: 0;
      padding: 16px;
      font-family: Arial, Helvetica, sans-serif;
      background: #f2f2f2;
      display: flex;
      justify-content: center;
    }
    .contenedor {
      width: 100%;
      max-width: 360px;
      text-align: center;
    }
    .credencial {
      width: 100%;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
    }
    h2 {
      margin: 20px 0 10px;
    }
    button {
      display: block;
      width: 100%;
      padding: 12px;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin-bottom: 12px;
    }
    #estado {
      background: #9e9e9e;
      color: #fff;
    }
    #btnBeneficios {
      background: #1f5f99;
      color: #fff;
    }
    #beneficios {
      display: none;
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
      padding: 8px 16px;
      text-align: left;
    }
    #beneficios.abierto {
      display: block;
    }
    #beneficios p {
      margin: 10px 0;
      padding-bottom: 10px;
      border-bottom: 1px solid #e0e0e0;
    }
    #beneficios p:last-child {
      border-bottom: none;
    }
  </style>
</head>
<body>
  <div class="contenedor">
    <img class="credencial" src="WhatsApp%20Image%202026-10-06%20at%202.55.49%20PM.jpeg" alt="Credencial">

    <h2>Status</h2>
    <button id="estado" type="button">Activo</button>

    <button id="btnBeneficios" type="button">Beneficios</button>
    <div id="beneficios">
      <p>5% de descuento en negocio</p>
      <p>10% de descuento en negocio</p>
      <p>15% de descuento en negocio</p>
    </div>
  </div>

  <script>
    const estado = document.getElementById('estado');
    estado.addEventListener('click', () => {
      estado.textContent = estado.textContent === 'Activo' ? 'Inactivo' : 'Activo';
    });

    document.getElementById('btnBeneficios').addEventListener('click', () => {
      document.getElementById('beneficios').classList.toggle('abierto');
    });
  </script>
</body>
</html>
