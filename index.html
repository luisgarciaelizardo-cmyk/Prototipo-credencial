<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Credencial</title>
  <style>
    body {
      margin: 0;
      padding: 16px;
      font-family: Arial, Helvetica, sans-serif;
      background: #0d0d0d;
      color: #f5f0e6;
      display: flex;
      justify-content: center;
    }
    .contenedor {
      width: 100%;
      max-width: 360px;
      text-align: center;
    }
    .credencial {
      width: 100%;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(212, 175, 55, 0.25);
    }
    h2 {
      margin: 20px 0 10px;
      color: #d4af37;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    button {
      display: block;
      width: 100%;
      padding: 12px;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin-bottom: 12px;
    }
    #estado {
      background: #6b6b6b;
      color: #fff;
      border: 1px solid #d4af37;
    }
    #btnBeneficios {
      background: linear-gradient(90deg, #b8912f, #e6c55a, #b8912f);
      color: #111;
      font-weight: bold;
    }
    #beneficios {
      display: none;
      background: #1a1a1a;
      border: 1px solid #d4af37;
      border-radius: 8px;
      padding: 8px 16px;
      text-align: left;
    }
    #beneficios.abierto {
      display: block;
    }
    #beneficios p {
      margin: 10px 0;
      padding-bottom: 10px;
      border-bottom: 1px solid #3a3326;
    }
    #beneficios p:last-child {
      border-bottom: none;
    }
  </style>
</head>
<body>
  <div class="contenedor">
    <img class="credencial" src="WhatsApp%20Image%202026-10-06%20at%203.37.23%20PM.jpeg" alt="Credencial">

    <h2>Status</h2>
    <button id="estado" type="button">Activo</button>

    <button id="btnBeneficios" type="button">Beneficios</button>
    <div id="beneficios">
      <p>5% de descuento en negocio</p>
      <p>10% de descuento en negocio</p>
      <p>15% de descuento en negocio</p>
    </div>
  </div>

  <script>
    const estado = document.getElementById('estado');
    estado.addEventListener('click', () => {
      estado.textContent = estado.textContent === 'Activo' ? 'Inactivo' : 'Activo';
    });

    document.getElementById('btnBeneficios').addEventListener('click', () => {
      document.getElementById('beneficios').classList.toggle('abierto');
    });
  </script>
</body>
</html>
